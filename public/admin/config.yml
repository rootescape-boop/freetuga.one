# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: rootescape-boop/freetuga.one
  branch: main

site_url: https://freetuga.one
display_url: https://freetuga.one
logo:
  src: /logo.jpg

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: unicode
  clean_accents: true
  lowercase: true

collections:
  - name: posts
    label: Записи
    label_singular: Запись
    folder: src/content/posts
    extension: mdx
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    slug: "{{fields.slug}}"
    preview_path: "{{fields.section}}/{{fields.slug}}"
    summary: "{{title}} — {{date | date('DD.MM.YYYY')}}"
    sortable_fields: [date, title]
    fields:
      - name: title
        label: Заголовок
        widget: string
      - name: section
        label: Раздел
        widget: select
        options:
          - { label: Материалы, value: materials }
          - { label: ЧАВО, value: faq }
          - { label: Релизы, value: releases }
          - { label: ПО, value: software }
        default: materials
        hint: "Определяет адрес записи: /materials, /faq, /releases или /software."
      - name: slug
        label: Адрес материала
        widget: string
        hint: "Латиницей, через дефис: naprimer-tak. Именно этот адрес попадёт в ссылку."
      - name: description
        label: Краткое описание
        widget: text
        hint: "Одно-два предложения для карточки и поисковиков."
      - name: date
        label: Дата
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: cover
        label: Обложка
        widget: image
        required: false
        hint: "Идеально — 1600×1000 px. Можно оставить пустым."
      - name: coverAlt
        label: Описание обложки
        widget: string
        required: false
        hint: "Для незрячих читателей и поисковиков."
      - name: tags
        label: Теги
        widget: list
        required: false
        default: []
        hint: "Каждый тег — отдельный элемент списка."
      - name: videos
        label: Видео
        widget: list
        required: false
        summary: "{{fields.platform}} · {{fields.id}}"
        hint: "Ролики появятся над текстом материала и загрузятся только по клику."
        fields:
          - name: platform
            label: Платформа
            widget: select
            options:
              - { label: YouTube, value: youtube }
              - { label: Rutube, value: rutube }
              - { label: VK Видео, value: vk }
          - name: id
            label: ID видео
            widget: string
            hint: "YouTube: из watch?v=ID или youtu.be/ID. Rutube: 32 символа из rutube.ru/video/ID/. VK: из vk.com/video-12345678_456239017 — часть после /video."
          - name: poster
            label: Обложка вручную
            widget: image
            required: false
            hint: "Необязательно. Пригодится для VK: если автопревью не загрузилось, поставьте свою картинку 16:9."
          - name: title
            label: Подпись
            widget: string
            required: false
      - name: featured
        label: Показывать на главной
        widget: boolean
        default: false
        hint: "Избранный материал занимает большой блок на главной странице."
      - name: draft
        label: Черновик
        widget: boolean
        default: false
        hint: "Черновики не попадают на сайт, но остаются в репозитории."
      - name: body
        label: Текст материала
        widget: markdown

  - name: pages
    label: Страницы
    files:
      - name: home
        label: Главная
        file: src/content/pages/home.mdx
        fields:
          - name: title
            label: Заголовок
            widget: string
            hint: "Заголовок главной страницы — большой текст вверху."
          - name: description
            label: Описание
            widget: text
            required: false
            hint: "Короткое описание проекта под заголовком (1–2 предложения)."
          - name: banner
            label: Баннер
            widget: image
            required: false
            hint: "Широкая картинка, идеально 1600×640 px (21:9). Пусто — баннер не показывается."
          - name: features
            label: Преимущества
            widget: list
            required: false
            default: []
            hint: "Карточки преимуществ на главной странице."
            fields:
              - name: title
                label: Заголовок
                widget: string
              - name: text
                label: Описание
                widget: text
                required: false
                hint: "Одно-два предложения о преимуществе."
      - name: about
        label: О проекте
        file: src/content/pages/about.mdx
        fields:
          - name: title
            label: Заголовок
            widget: string
          - name: description
            label: Описание
            widget: text
            required: false
          - name: body
            label: Текст
            widget: markdown
      - name: donate
        label: Поддержать проект
        file: src/content/pages/donate.mdx
        fields:
          - name: title
            label: Заголовок
            widget: string
          - name: description
            label: Описание
            widget: text
            required: false
          - name: body
            label: Текст
            widget: markdown

  - name: settings
    label: Настройки
    files:
      - name: site
        label: Сайт
        file: src/data/site.json
        format: json
        fields:
          - name: title
            label: Название сайта
            widget: string
          - name: description
            label: Описание
            widget: text
          - name: telegram
            label: Ссылка на Telegram
            widget: string
          - name: max
            label: Ссылка на Max
            widget: string
          - name: startYear
            label: Год основания
            widget: number
            value_type: int
            min: 2000
            max: 2100
