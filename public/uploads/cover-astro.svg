  <rect width="1600" height="1000" fill="url(#blob2)"/>
  <g fill="none" stroke="#20241b" stroke-opacity=".16" stroke-width="2">
    <rect x="930" y="180" width="420" height="420" rx="18" transform="rotate(-8 1140 390)"/>
    <rect x="980" y="230" width="420" height="420" rx="18" transform="rotate(-8 1190 440)"/>
    <path d="M140 760H620M140 812H520M140 864H580"/>
  </g>
  <g fill="#20241b" fill-opacity=".55">
    <circle cx="1380" cy="820" r="8"/>
