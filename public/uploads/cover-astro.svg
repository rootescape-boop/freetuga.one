<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Абстрактная композиция в оливковых тонах">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e9ebe0"/>
      <stop offset="1" stop-color="#d3dac6"/>
    </linearGradient>
    <radialGradient id="blob1" cx="22%" cy="78%" r="55%">
      <stop offset="0" stop-color="#5f6f52" stop-opacity=".5"/>
      <stop offset="1" stop-color="#5f6f52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="80%" cy="18%" r="50%">
      <stop offset="0" stop-color="#b8863f" stop-opacity=".42"/>
      <stop offset="1" stop-color="#b8863f" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
