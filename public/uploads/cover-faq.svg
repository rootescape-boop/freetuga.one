<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Абстрактная композиция в серо-зелёных тонах">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eae6"/>
      <stop offset="1" stop-color="#cfd6cd"/>
    </linearGradient>
    <radialGradient id="blob1" cx="26%" cy="24%" r="52%">
      <stop offset="0" stop-color="#3f5d4f" stop-opacity=".48"/>
      <stop offset="1" stop-color="#3f5d4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="82%" cy="82%" r="50%">
      <stop offset="0" stop-color="#8a7650" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8a7650" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#blob1)"/>
  <rect width="1600" height="1000" fill="url(#blob2)"/>
  <g fill="none" stroke="#1c2a22" stroke-opacity=".18" stroke-width="2">
    <circle cx="1080" cy="480" r="230"/>
    <circle cx="1080" cy="480" r="130"/>
    <path d="M1080 210v540M810 480h540"/>
  </g>
  <g fill="#1c2a22" fill-opacity=".5">
    <circle cx="340" cy="720" r="7"/>
    <circle cx="1340" cy="260" r="8"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".14"/>
</svg>
