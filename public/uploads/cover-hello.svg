<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Абстрактная композиция в песочных тонах">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ecdf"/>
      <stop offset="1" stop-color="#e6d5bd"/>
    </linearGradient>
    <radialGradient id="blob1" cx="28%" cy="22%" r="58%">
      <stop offset="0" stop-color="#c0562f" stop-opacity=".52"/>
      <stop offset="1" stop-color="#c0562f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="82%" cy="86%" r="52%">
      <stop offset="0" stop-color="#6f7d6a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6f7d6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#blob1)"/>
  <rect width="1600" height="1000" fill="url(#blob2)"/>
  <g fill="none" stroke="#2b2118" stroke-opacity=".16" stroke-width="2">
    <circle cx="1170" cy="310" r="210"/>
    <circle cx="1170" cy="310" r="300"/>
    <circle cx="1170" cy="310" r="390"/>
    <path d="M120 850C420 650 760 960 1120 760"/>
  </g>
  <g fill="#2b2118" fill-opacity=".55">
    <circle cx="372" cy="298" r="9"/>
    <circle cx="1452" cy="760" r="6"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".14"/>
</svg>
