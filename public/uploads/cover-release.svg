<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Абстрактная композиция в терракотовых и песочных тонах">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f1e6da"/>
      <stop offset="1" stop-color="#e2cdb6"/>
    </linearGradient>
    <radialGradient id="blob1" cx="70%" cy="26%" r="54%">
      <stop offset="0" stop-color="#b4552e" stop-opacity=".44"/>
      <stop offset="1" stop-color="#b4552e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="16%" cy="84%" r="50%">
      <stop offset="0" stop-color="#5d6b4f" stop-opacity=".4"/>
      <stop offset="1" stop-color="#5d6b4f" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#blob1)"/>
  <rect width="1600" height="1000" fill="url(#blob2)"/>
  <g fill="none" stroke="#2b1d14" stroke-opacity=".18" stroke-width="2">
    <path d="M320 720h280M600 720V520M600 520h240M840 520v200M840 720h440"/>
    <circle cx="1180" cy="340" r="110"/>
    <circle cx="1180" cy="340" r="14"/>
  </g>
  <g fill="#2b1d14" fill-opacity=".5">
    <circle cx="260" cy="300" r="7"/>
    <circle cx="1400" cy="820" r="8"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".14"/>
