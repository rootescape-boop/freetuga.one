<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Абстрактная композиция в сливовых тонах">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e6e7"/>
      <stop offset="1" stop-color="#e0cbd1"/>
    </linearGradient>
    <radialGradient id="blob1" cx="78%" cy="22%" r="58%">
      <stop offset="0" stop-color="#7a3b4a" stop-opacity=".48"/>
      <stop offset="1" stop-color="#7a3b4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="20%" cy="82%" r="55%">
